<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0510">
<title>❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bg"></div><div id="fx"></div><div id="flash"></div>
<button id="mini" class="hidden" aria-label="music"><span class="bars"><i></i><i></i><i></i><i></i></span><b id="mi">❚❚</b></button>

<main id="app">
  <section class="scene" id="s1">
    <p class="small up d1">من <b>حمودي</b> إلى <b>رفلوتي</b> ❤️</p>
    <h1 class="date up d2">13 / 10 / 2026</h1>
    <p class="lead up d3">رفل... اليوم مو مثل أي يوم. ❤️</p>
    <button class="btn up d4" id="enter">ادخلي... عندي شي إلج ❤️</button>
  </section>

  <section class="scene" id="s2">
    <p class="lead up d1">قبل لا نبدي...</p>
    <button class="btn up d2" id="play">شغلي الأغنية 🎵</button>
  </section>

  <section class="scene" id="s3">
    <h2 id="q" class="qtext"></h2>
    <div id="opts"></div>
    <p id="resp" class="resp"></p>
    <div id="bday" class="bday"><span>🎂</span><h1 class="date">13 / 10 / 2026</h1></div>
  </section>

  <section class="scene" id="s4">
    <div class="letter"><div class="txt" id="t1"></div><p class="sig" id="sig1">من حمودي ❤️</p></div>
    <button class="btn hidden" id="more">بعد أكو شي إلج... ❤️</button>
  </section>

  <section class="scene" id="s5">
    <div class="bigheart">❤️</div>
    <p class="lead" id="c1"></p><p class="lead gold" id="c2"></p>
  </section>

  <section class="scene" id="s6">
    <div class="letter"><div class="txt" id="t2"></div></div>
  </section>

  <section class="scene" id="s7">
    <h1 class="big" id="f1"></h1>
    <p class="lead" id="f2"></p>
    <p class="lead" id="f3"></p>
    <h1 class="date" id="f4"></h1>
    <p class="lead gold" id="f5"></p>
    <p class="small" id="f6"></p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
